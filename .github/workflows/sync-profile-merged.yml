name: Splice profile merged list

# Lives in devtechedge/devtechedge. Copied there by the ledger bootstrap.
# Fetches docs/generated/profile-merged.md from oss-contributions (public)
# and splices it into this profile README. No PAT required.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"
  repository_dispatch:
    types: [ledger-profile-sync]

concurrency:
  group: splice-profile-merged
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  splice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch fragment and splice
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/devtechedge/oss-contributions/main/docs/generated/profile-merged.md" -o /tmp/fragment.md
          python3 << 'PY'
          from pathlib import Path
          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          frag = Path("/tmp/fragment.md").read_text(encoding="utf-8")
          start = "<!-- ledger:profile-merged:start -->"
          end = "<!-- ledger:profile-merged:end -->"
          if start not in frag or end not in frag:
              raise SystemExit("fragment missing markers")
          inner = frag[frag.index(start) : frag.index(end) + len(end)]
          if start in readme and end in readme:
              new = readme[: readme.index(start)] + inner + readme[readme.index(end) + len(end) :]
          else:
              needle = "### Merged:\n\n"
              if needle not in readme:
                  raise SystemExit("cannot find Merged section")
              i = readme.index(needle) + len(needle)
              j = readme.index("\n---\n", i)
              new = readme[:i] + inner + "\n" + readme[j:]
          if not new.endswith("\n"):
              new += "\n"
          if new != readme:
              readme_path.write_text(new, encoding="utf-8")
              print("updated")
          else:
              print("unchanged")
          PY

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No profile README changes"
            exit 0
          fi
          git commit -m "chore(profile): splice merged OSS list"
          git push
